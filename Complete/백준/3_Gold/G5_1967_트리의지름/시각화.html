    desc: '➡️ <b>6 → 11</b> 탐색<br>간선 가중치: 6<br>dist[11] = 35 + 6 = <b>41</b>',
    active: [11], done: [9,5,3,1,2,4,7,8,10,6], far: [9], diam: [],
    activeEdges: [{u:6,v:11}], doneEdges: [{u:5,v:9},{u:3,v:5},{u:1,v:3},{u:1,v:2},{u:2,v:4},{u:4,v:7},{u:4,v:8},{u:5,v:10},{u:3,v:6}], diamEdges: [],
    distMap: { 9:0, 5:15, 3:26, 1:28, 2:31, 4:36, 7:37, 8:43, 10:19, 6:35, 11:41 }, maxNode: 11,
  },
  // 6→12 ← 최대!
  {
    phase: 2,
    desc: '➡️ <b>6 → 12</b> 탐색<br>간선 가중치: 10<br>dist[12] = 35 + 10 = <b>45</b> 🔴<br>최대 거리 갱신! B = 노드 12',
    active: [12], done: [9,5,3,1,2,4,7,8,10,6,11], far: [9], diam: [],
    activeEdges: [{u:6,v:12}], doneEdges: [{u:5,v:9},{u:3,v:5},{u:1,v:3},{u:1,v:2},{u:2,v:4},{u:4,v:7},{u:4,v:8},{u:5,v:10},{u:3,v:6},{u:6,v:11}], diamEdges: [],
    distMap: { 9:0, 5:15, 3:26, 1:28, 2:31, 4:36, 7:37, 8:43, 10:19, 6:35, 11:41, 12:45 }, maxNode: 12,
  },
  // 최종
  {
    phase: 3,
    desc: '🎉 <b>완료! 트리의 지름 = 45</b><br><br>지름 경로: <b>9 → 5 → 3 → 6 → 12</b><br>거리: 15 + 11 + 9 + 10 = <b>45</b><br><br>✅ DFS 2번만으로 O(N)에 해결!',
    active: [], done: [1,2,4,7,8,10], far: [9,12], diam: [9,5,3,6,12],
    activeEdges: [], doneEdges: [{u:1,v:2},{u:2,v:4},{u:4,v:7},{u:4,v:8},{u:5,v:10},{u:6,v:11}],
    diamEdges: [{u:5,v:9},{u:3,v:5},{u:1,v:3},{u:3,v:6},{u:6,v:12}],
    distMap: { 9:0, 5:15, 3:26, 1:28, 2:31, 4:36, 7:37, 8:43, 10:19, 6:35, 11:41, 12:45 }, maxNode: 12,
  },
];

// ─── 렌더링 ───
const svg = document.getElementById('tree');
const NS  = 'http://www.w3.org/2000/svg';

function edgeKey(u, v) { return `${Math.min(u,v)}-${Math.max(u,v)}`; }

function mkEl(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}

// 간선 그리기
const edgeEls = {};
for (const e of edges) {
  const n1 = nodes[e.u], n2 = nodes[e.v];
  const mx = (n1.x + n2.x) / 2, my = (n1.y + n2.y) / 2;

  const line = mkEl('line', {
    x1: n1.x, y1: n1.y, x2: n2.x, y2: n2.y,
    stroke: '#30363d', 'stroke-width': 3, 'stroke-linecap': 'round',
  });
  svg.appendChild(line);

  const wtBg = mkEl('rect', { x: mx-12, y: my-10, width:24, height:18, rx:4, fill:'#0d1117' });
  const wt   = mkEl('text', { x: mx, y: my+4, 'text-anchor':'middle', 'font-size':11, fill:'#8b949e' });
  wt.textContent = e.w;
  svg.appendChild(wtBg);
  svg.appendChild(wt);

  edgeEls[edgeKey(e.u, e.v)] = { line, wt, wtBg };
}

// 노드 그리기
const nodeEls = {};
for (const [id, n] of Object.entries(nodes)) {
  const g    = mkEl('g', {});
  const circ = mkEl('circle', { cx: n.x, cy: n.y, r: 20, fill:'#21262d', stroke:'#8b949e', 'stroke-width':2 });
  const txt  = mkEl('text', { x: n.x, y: n.y+5, 'text-anchor':'middle', 'font-size':13, fill:'#e6edf3', 'font-weight':'600' });
  txt.textContent = n.label;

  const distTxt = mkEl('text', { x: n.x, y: n.y+36, 'text-anchor':'middle', 'font-size':11, fill:'#8b949e' });
  distTxt.textContent = '';

  g.appendChild(circ);
  g.appendChild(txt);
  g.appendChild(distTxt);
  svg.appendChild(g);
  nodeEls[id] = { circ, txt, distTxt };
}

// ─── 상태 업데이트 ───
let cur = 0, autoTimer = null;

function render(idx) {
  const s = steps[idx];

  // 간선 색
  for (const e of edges) {
    const key  = edgeKey(e.u, e.v);
    const el   = edgeEls[key];
    const isDiam   = s.diamEdges.some(de => edgeKey(de.u,de.v) === key);
    const isActive = s.activeEdges.some(ae => edgeKey(ae.u,ae.v) === key);
    const isDone   = s.doneEdges.some(de => edgeKey(de.u,de.v) === key);
    el.line.setAttribute('stroke',
      isDiam   ? '#d29922' :
      isActive ? (s.phase === 1 ? '#58a6ff' : '#bc8cff') :
      isDone   ? '#3fb950' : '#30363d');
    el.line.setAttribute('stroke-width', isDiam ? 5 : (isActive ? 4 : 3));
  }

  // 노드 색
  for (const id of Object.keys(nodes)) {
    const nid = parseInt(id);
    const el  = nodeEls[id];
    const isDiam   = s.diam.includes(nid);
    const isFar    = s.far.includes(nid);
    const isActive = s.active.includes(nid);
    const isDone   = s.done.includes(nid);

    el.circ.setAttribute('fill',
      isDiam   ? '#3a2e0a' :
      isFar    ? '#3a1f1a' :
      isActive ? (s.phase === 1 ? '#1f3a5f' : '#2a1f5f') :
      isDone   ? '#1a2d1a' : '#21262d');
    el.circ.setAttribute('stroke',
      isDiam   ? '#d29922' :
      isFar    ? '#f78166' :
      isActive ? (s.phase === 1 ? '#58a6ff' : '#bc8cff') :
      isDone   ? '#3fb950' : '#8b949e');
    el.circ.setAttribute('stroke-width', (isDiam || isFar || isActive) ? 3 : 2);

    // 거리 표시
    const d = s.distMap[nid];
    el.distTxt.textContent = d !== undefined ? `d=${d}` : '';
    el.distTxt.setAttribute('fill',
      isDiam   ? '#d29922' :
      isFar    ? '#f78166' :
      isActive ? (s.phase === 1 ? '#58a6ff' : '#bc8cff') : '#8b949e');
  }

  // 패널
  document.getElementById('stepDesc').innerHTML = s.desc;
  const badge = document.getElementById('phaseBadge');
  if (s.phase === 1) { badge.className = 'phase-badge phase1'; badge.textContent = 'Phase 1 — 1번에서 A 탐색'; }
  else if (s.phase === 2) { badge.className = 'phase-badge phase2'; badge.textContent = 'Phase 2 — A에서 B 탐색'; }
  else { badge.className = 'phase-badge done'; badge.textContent = '완료 — 지름 발견!'; }

  // 거리 테이블
  const tbody = document.getElementById('distBody');
  tbody.innerHTML = '';
  const sorted = Object.entries(s.distMap).sort((a,b) => parseInt(a[0])-parseInt(b[0]));
  for (const [nid, d] of sorted) {
    const tr = document.createElement('tr');
    const isMax = s.maxNode == nid;
    const isCur = s.active.includes(parseInt(nid));
    if (isMax) tr.className = 'highlight';
    else if (isCur) tr.className = 'current';
    tr.innerHTML = `<td>노드 ${nid}</td><td>${d}</td><td>${isMax ? '🔴 최대' : ''}</td>`;
    tbody.appendChild(tr);
  }

  // 버튼
  document.getElementById('btnFirst').disabled = idx === 0;
  document.getElementById('btnPrev').disabled  = idx === 0;
  document.getElementById('btnNext').disabled  = idx === steps.length - 1;
  document.getElementById('btnLast').disabled  = idx === steps.length - 1;
  document.getElementById('stepCounter').textContent = `${idx+1} / ${steps.length}`;
}

function goTo(idx) { cur = idx; render(cur); }
function next() { if (cur < steps.length-1) { cur++; render(cur); } }
function prev() { if (cur > 0) { cur--; render(cur); } }

function toggleAuto() {
  const btn = document.getElementById('btnAuto');
  if (autoTimer) {
    clearInterval(autoTimer);
    autoTimer = null;
    btn.textContent = '▶ 자동';
    btn.classList.remove('primary');
  } else {
    btn.textContent = '⏸ 정지';
    btn.classList.add('primary');
    autoTimer = setInterval(() => {
      if (cur >= steps.length - 1) {
        clearInterval(autoTimer); autoTimer = null;
        btn.textContent = '▶ 자동';
        btn.classList.remove('primary');
      } else { next(); }
    }, 900);
  }
}

render(0);
</script>
</body>
</html>
