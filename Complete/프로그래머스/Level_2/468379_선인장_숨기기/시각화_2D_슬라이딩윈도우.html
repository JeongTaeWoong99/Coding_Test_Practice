<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D 슬라이딩 윈도우 Min 시각화 | 선인장 숨기기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e2e; color: #cdd6f4; font-family: 'Consolas', 'Courier New', monospace; padding: 22px 26px; min-height: 100vh; }

    header { margin-bottom: 14px; }
    h1 { color: #cba6f7; font-size: 1.35em; margin-bottom: 3px; }
    .subtitle { color: #6c7086; font-size: 0.8em; }

    /* Tabs */
    .example-tabs { display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
    .tab { background: #313244; color: #6c7086; border: 1px solid #45475a; padding: 5px 16px; border-radius: 6px; cursor: pointer; font-size: 0.8em; font-family: inherit; transition: background .12s, color .12s; }
    .tab:hover { background: #45475a; color: #cdd6f4; }
    .tab.active { background: #45475a; color: #cba6f7; border-color: #cba6f7; }

    /* Legend */
    .legend { display: flex; gap: 11px; flex-wrap: wrap; margin-bottom: 14px; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.73em; color: #a6adc8; }
    .legend-box { width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0; }
    .lb-normal  { background: #313244; border: 1px solid #585b70; }
    .lb-proc    { background: #89dceb; }
    .lb-window  { background: #f38ba8; }
    .lb-current { background: #fab387; }
    .lb-filled  { background: #a6e3a1; }
    .lb-empty   { background: #181825; border: 1px solid #313244; }
    .lb-inf     { background: #252535; border: 1px dashed #6c7086; }
    .lb-answer  { background: #cba6f7; }

    .phase-badge { display: inline-block; background: #313244; color: #89b4fa; padding: 3px 10px; border-radius: 4px; font-size: 0.77em; margin-bottom: 7px; }

    .desc-box { background: #181825; border-left: 3px solid #89b4fa; padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 0.83em; line-height: 1.65; min-height: 54px; margin-bottom: 14px; white-space: pre-wrap; }

    .grids-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-start; }
    .grid-panel { flex-shrink: 0; }
    .grid-label { font-size: 0.78em; color: #a6e3a1; font-weight: bold; margin-bottom: 3px; }
    .grid-sub   { font-size: 0.68em; color: #6c7086; margin-bottom: 6px; }

    table { border-collapse: separate; border-spacing: 3px; }
    td { width: 42px; height: 42px; text-align: center; vertical-align: middle; border-radius: 4px; font-size: 0.86em; font-weight: bold; transition: background .14s, color .14s; }
    td.hdr { background: transparent; color: #45475a; font-size: 0.66em; font-weight: normal; width: 16px; }

    td.cell-normal  { background: #313244; color: #cdd6f4; }
    td.cell-inf     { background: #252535; color: #45475a; font-style: italic; font-size: 0.73em; }
    td.cell-proc    { background: #89dceb; color: #1e1e2e; }   /* 현재 처리 중인 위치 */
    td.cell-window  { background: #f38ba8; color: #1e1e2e; }   /* 윈도우 범위 */
    td.cell-current { background: #fab387; color: #1e1e2e; }   /* 결과 기록 중인 셀 */
    td.cell-filled  { background: #a6e3a1; color: #1e1e2e; }   /* 계산 완료 */
    td.cell-empty   { background: #181825; color: #313244; }   /* 미계산 */
    td.cell-answer  { background: #cba6f7; color: #1e1e2e; }   /* 정답 */

    .arrow-between { color: #89b4fa; font-size: 1.25em; display: flex; align-items: center; padding-top: 30px; }

    /* Operations log */
    .ops-panel { background: #181825; border: 1px solid #313244; border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; }
    .ops-title { color: #89dceb; font-size: 0.77em; margin-bottom: 8px; font-weight: bold; }
    .ops-list { display: flex; flex-direction: column; gap: 4px; min-height: 22px; }
    .op-item { display: flex; align-items: flex-start; gap: 10px; font-size: 0.8em; line-height: 1.5; }
    .op-num  { color: #45475a; flex-shrink: 0; width: 16px; }
    .op-type { flex-shrink: 0; width: 80px; font-weight: bold; }
    .op-detail { color: #f9e2af; }
    .op-reason { color: #6c7086; }
    .op-type.front-pop { color: #f38ba8; }
    .op-type.back-pop  { color: #fab387; }
    .op-type.push      { color: #a6e3a1; }
    .op-type.record    { color: #cba6f7; }
    .ops-empty { color: #45475a; font-style: italic; font-size: 0.8em; }

    /* Deque panel */
    .deque-panel { background: #181825; border: 1px solid #313244; border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; }
    .deque-title { color: #f9e2af; font-size: 0.77em; margin-bottom: 7px; }
    .deque-items { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; min-height: 25px; }
    .deque-item { background: #313244; border: 1px solid #f9e2af; padding: 2px 9px; border-radius: 4px; font-size: 0.79em; color: #f9e2af; }
    .deque-item.is-front { background: #fab387; color: #1e1e2e; border-color: #fab387; }
    .deque-sep   { color: #45475a; font-size: 0.82em; }
    .deque-label { color: #6c7086; font-size: 0.68em; margin: 0 3px; }
    .deque-empty { color: #45475a; font-style: italic; font-size: 0.79em; }

    .min-panel { display: inline-flex; align-items: center; gap: 9px; background: #181825; border: 1px solid #fab387; border-radius: 6px; padding: 6px 13px; margin-bottom: 14px; font-size: 0.83em; }
    .min-label { color: #fab387; }
    .min-value { color: #a6e3a1; font-size: 1.08em; font-weight: bold; }

    .controls { display: flex; align-items: center; gap: 11px; padding-top: 12px; border-top: 1px solid #313244; }
    button.nav-btn { background: #313244; color: #cdd6f4; border: 1px solid #45475a; padding: 6px 17px; border-radius: 6px; cursor: pointer; font-size: 0.82em; font-family: inherit; transition: background .12s; user-select: none; }
    button.nav-btn:hover:not(:disabled) { background: #45475a; }
    button.nav-btn:disabled { opacity: 0.35; cursor: default; }
    .progress-wrap { flex: 1; height: 4px; background: #313244; border-radius: 2px; overflow: hidden; }
    .progress-bar  { height: 100%; background: #89b4fa; border-radius: 2px; transition: width .12s; }
    .step-counter  { color: #6c7086; font-size: 0.78em; white-space: nowrap; }
    .key-hint      { color: #45475a; font-size: 0.68em; }
  </style>
</head>
<body>
<header>
  <h1>2D 슬라이딩 윈도우 Min 시각화</h1>
  <p class="subtitle">선인장 숨기기 — 단조 덱 연산 과정 포함</p>
</header>

<div class="example-tabs">
  <button class="tab active" id="tab-0" onclick="loadExample(0)">예제 1 &nbsp;|&nbsp; m=4, n=5, h=2, w=2 &nbsp;→&nbsp; [2, 2]</button>
  <button class="tab"        id="tab-1" onclick="loadExample(1)">예제 2 &nbsp;|&nbsp; m=3, n=3, h=1, w=1 &nbsp;→&nbsp; [1, 1]</button>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-box lb-normal"></div>원본 셀</div>
  <div class="legend-item"><div class="legend-box lb-inf"></div>∞ (비 안 옴)</div>
  <div class="legend-item"><div class="legend-box lb-proc"></div>현재 처리 위치</div>
  <div class="legend-item"><div class="legend-box lb-window"></div>윈도우 범위</div>
  <div class="legend-item"><div class="legend-box lb-current"></div>결과 기록 중</div>
  <div class="legend-item"><div class="legend-box lb-filled"></div>계산 완료</div>
  <div class="legend-item"><div class="legend-box lb-empty"></div>미계산</div>
  <div class="legend-item"><div class="legend-box lb-answer"></div>정답</div>
</div>

<div class="phase-badge" id="phase-badge">시작</div>
<div class="desc-box" id="description"></div>

<div class="grids-row" id="grids-row"></div>

<div class="ops-panel">
  <div class="ops-title">🔄 이번 단계 덱 연산 순서</div>
  <div class="ops-list" id="ops-list"></div>
</div>

<div class="deque-panel">
  <div class="deque-title">📦 단조 덱 상태 (연산 후)</div>
  <div class="deque-items" id="deque-items"></div>
</div>

<div id="min-panel"></div>

<div class="controls">
  <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">← 이전</button>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <span class="step-counter" id="step-counter"></span>
  <button class="nav-btn" id="btn-next" onclick="navigate(1)">다음 →</button>
  <span class="key-hint">← → 키 사용 가능</span>
</div>

<script>
const INF = Infinity;

const EX1 = {
  m: 4, n: 5, h: 2, w: 2,
  grid: [
    [1,   INF, INF, INF, 8  ],
    [INF, 5,   INF, 3,   INF],
    [INF, INF, 6,   7,   4  ],
    [INF, 2,   INF, INF, INF]
  ]
};
const EX2 = {
  m: 3, n: 3, h: 1, w: 1,
  grid: [
    [1, 2, 3],
    [4, 9, 5],
    [6, 7, 8]
  ]
};
const EXAMPLES = [EX1, EX2];

function D(v) { return v === null ? '' : v === INF ? '∞' : String(v); }
function cp(a) { return a.map(r => [...r]); }
function nullGrid(r, c) { return Array(r).fill(null).map(() => Array(c).fill(null)); }

// ─── 스텝 생성 ───────────────────────────────────────────────────
function generateSteps(ex) {
  const { m, n, h, w, grid } = ex;
  const nc = n - w + 1, mr = m - h + 1;
  const steps = [];
  const rowMin = nullGrid(m, nc);
  const result = nullGrid(mr, nc);

  // ── 소개 ──
  steps.push({
    phase: 'intro',
    phaseName: '원본 격자 확인',
    description:
`각 셀 = drops 배열에서 해당 좌표에 비가 오는 순서 (1-indexed)
∞   = 비가 영원히 오지 않는 셀 (이 셀 포함 윈도우 = 완벽한 은신처)

목표: h×w 윈도우의 min 최대인 위치 [r, c] → 2D 슬라이딩 윈도우 Min O(m×n)`,
    gridProc: null, gridWin: [], rowMinWin: [], rowMinCur: null,
    rowMinSnap: cp(rowMin), resultWin: [], resultCur: null,
    resultSnap: cp(result), resultAns: null,
    deque: [], dequeAxis: '', ops: [], minVal: null,
  });

  // ── Phase 1: 행 방향 (모든 j 스텝) ──
  for (let i = 0; i < m; i++) {
    const dq = [];
    for (let j = 0; j < n; j++) {
      const ops = [];

      // while 1: 윈도우 밖 앞 제거
      while (dq.length && dq[0] <= j - w) {
        const out = dq[0];
        ops.push({ type: 'front_pop', idx: out, val: grid[i][out],
          reason: `idx=${out} ≤ j-w = ${j}-${w} = ${j-w}  →  윈도우 왼쪽 밖으로 벗어남` });
        dq.shift();
      }

      // while 2: 현재값보다 크거나 같은 뒤 제거
      while (dq.length && grid[i][dq[dq.length-1]] >= grid[i][j]) {
        const out = dq[dq.length-1];
        ops.push({ type: 'back_pop', idx: out, val: grid[i][out], newVal: grid[i][j],
          reason: `뒤쪽 idx=${out}(값=${D(grid[i][out])}) ≥ 현재값(${D(grid[i][j])})  →  이후 최솟값 불가, 제거` });
        dq.pop();
      }

      // push
      ops.push({ type: 'push', idx: j, val: grid[i][j],
        reason: `j=${j} (값=${D(grid[i][j])}) → 덱 뒤에 삽입` });
      dq.push(j);

      // record (if window full)
      let minVal = null, rowMinCur = null;
      if (j >= w - 1) {
        const col = j - w + 1;
        rowMin[i][col] = grid[i][dq[0]];
        minVal = rowMin[i][col];
        rowMinCur = { r: i, c: col };
        ops.push({ type: 'record', row: i, col,
          reason: `덱 front: idx=${dq[0]} (값=${D(grid[i][dq[0]])}) = 윈도우 [${col}~${j}] 최솟값  →  rowMin[${i}][${col}] = ${D(minVal)}` });
      }

      // window cells in original grid
      const winStart = Math.max(0, j - w + 1);
      const winCells = (j >= w - 1) ? Array.from({length: w}, (_, k) => ({r: i, c: winStart + k})) : [];

      steps.push({
        phase: 'p1',
        phaseName: `Step 1 — 행 방향  (행 ${i}, j=${j})`,
        description:
`행 ${i}  |  j = ${j}  (현재값: ${D(grid[i][j])})
${j >= w-1 ? `윈도우 [${winStart}~${j}] 완성 → 최솟값 = ${D(minVal)} → rowMin[${i}][${winStart}] 기록` : `윈도우 크기: ${j+1}/${w} (아직 미완성)`}`,
        gridProc: { r: i, c: j },
        gridWin: winCells,
        rowMinWin: [], rowMinCur,
        rowMinSnap: cp(rowMin),
        resultWin: [], resultCur: null,
        resultSnap: cp(result), resultAns: null,
        deque: dq.map(idx => ({ idx, val: grid[i][idx] })),
        dequeAxis: `행 ${i}의 열 인덱스`,
        ops, minVal,
      });
    }
  }

  // ── Phase 2: 열 방향 (모든 i 스텝) ──
  for (let j = 0; j < nc; j++) {
    const dq = [];
    for (let i = 0; i < m; i++) {
      const ops = [];

      // while 1: 윈도우 밖 앞 제거
      while (dq.length && dq[0] <= i - h) {
        const out = dq[0];
        ops.push({ type: 'front_pop', idx: out, val: rowMin[out][j],
          reason: `idx=${out} ≤ i-h = ${i}-${h} = ${i-h}  →  윈도우 위쪽 밖으로 벗어남` });
        dq.shift();
      }

      // while 2: 현재값보다 크거나 같은 뒤 제거
      while (dq.length && rowMin[dq[dq.length-1]][j] >= rowMin[i][j]) {
        const out = dq[dq.length-1];
        ops.push({ type: 'back_pop', idx: out, val: rowMin[out][j], newVal: rowMin[i][j],
          reason: `뒤쪽 idx=${out}(값=${D(rowMin[out][j])}) ≥ 현재값(${D(rowMin[i][j])})  →  이후 최솟값 불가, 제거` });
        dq.pop();
      }

      // push
      ops.push({ type: 'push', idx: i, val: rowMin[i][j],
        reason: `i=${i} (값=${D(rowMin[i][j])}) → 덱 뒤에 삽입` });
      dq.push(i);

      // record
      let minVal = null, resultCur = null;
      if (i >= h - 1) {
        const row = i - h + 1;
        result[row][j] = rowMin[dq[0]][j];
        minVal = result[row][j];
        resultCur = { r: row, c: j };
        ops.push({ type: 'record', row, col: j,
          reason: `덱 front: idx=${dq[0]} (값=${D(rowMin[dq[0]][j])}) = 윈도우 [${row}~${i}][${j}] 최솟값  →  result[${row}][${j}] = ${D(minVal)}` });
      }

      const winStart = Math.max(0, i - h + 1);
      const winCells = (i >= h - 1) ? Array.from({length: h}, (_, k) => ({r: winStart + k, c: j})) : [];

      steps.push({
        phase: 'p2',
        phaseName: `Step 2 — 열 방향  (열 ${j}, i=${i})`,
        description:
`열 ${j}  |  i = ${i}  (현재값 rowMin[${i}][${j}]: ${D(rowMin[i][j])})
${i >= h-1 ? `윈도우 [${winStart}~${i}][${j}] 완성 → 최솟값 = ${D(minVal)} → result[${winStart}][${j}] 기록` : `윈도우 크기: ${i+1}/${h} (아직 미완성)`}`,
        gridProc: null,
        gridWin: [],
        rowMinWin: winCells,
        rowMinCur: null,
        rowMinSnap: cp(rowMin),
        resultWin: [], resultCur,
        resultSnap: cp(result), resultAns: null,
        deque: dq.map(idx => ({ idx, val: rowMin[idx][j] })),
        dequeAxis: `열 ${j}의 행 인덱스`,
        ops, minVal,
      });
    }
  }

  // ── 최종 ──
  let bR = 0, bC = 0, bV = -1;
  for (let i = 0; i < mr; i++)
    for (let j = 0; j < nc; j++)
      if (result[i][j] > bV) { bV = result[i][j]; bR = i; bC = j; }

  steps.push({
    phase: 'final',
    phaseName: '완료 — max of min 탐색',
    description:
`result 전체에서 가장 큰 값을 찾습니다.
최댓값 ${D(bV)} → result[${bR}][${bC}]

선인장을 [${bR}, ${bC}]에 두면 ${D(bV)}번째 빗방울이 올 때 처음 맞습니다.
→  정답: [${bR}, ${bC}]`,
    gridProc: null, gridWin: [], rowMinWin: [], rowMinCur: null,
    rowMinSnap: cp(rowMin), resultWin: [], resultCur: null,
    resultSnap: cp(result), resultAns: { r: bR, c: bC },
    deque: [], dequeAxis: '', ops: [], minVal: null,
  });

  return { steps, nc, mr };
}

// ─── 렌더링 ─────────────────────────────────────────────────────
let curEx = EX1, steps = [], nc = 0, mr = 0, cur = 0;

function cellClass(val, isProc, isWin, isCur, isAns, isSource) {
  if (isAns)  return 'cell-answer';
  if (isCur)  return 'cell-current';
  if (isProc) return 'cell-proc';
  if (isWin)  return 'cell-window';
  if (val === null) return 'cell-empty';
  if (val === INF)  return 'cell-inf';
  return isSource ? 'cell-normal' : 'cell-filled';
}

function buildTable(data, rows, cols, winSet, procCell, curCell, ansCell, isSource) {
  let h = '<table><tr><td class="hdr"></td>';
  for (let c = 0; c < cols; c++) h += `<td class="hdr">${c}</td>`;
  h += '</tr>';
  for (let r = 0; r < rows; r++) {
    h += `<tr><td class="hdr">${r}</td>`;
    for (let c = 0; c < cols; c++) {
      const val    = data[r][c];
      const isProc = procCell && procCell.r === r && procCell.c === c;
      const isWin  = winSet.has(`${r},${c}`);
      const isCur  = curCell && curCell.r === r && curCell.c === c;
      const isAns  = ansCell && ansCell.r === r && ansCell.c === c;
      h += `<td class="${cellClass(val, isProc, isWin, isCur, isAns, isSource)}">${D(val)}</td>`;
    }
    h += '</tr>';
  }
  return h + '</table>';
}

function render() {
  const s = steps[cur];
  const { m, n, h, w, grid } = curEx;

  document.getElementById('phase-badge').textContent = s.phaseName;
  document.getElementById('description').textContent = s.description;

  const gWin  = new Set(s.gridWin.map(({r,c})  => `${r},${c}`));
  const rmWin = new Set(s.rowMinWin.map(({r,c}) => `${r},${c}`));

  let html = '';
  html += `<div class="grid-panel">
    <div class="grid-label">원본 격자 grid</div>
    <div class="grid-sub">m×n = ${m}×${n}</div>
    ${buildTable(grid, m, n, gWin, s.gridProc, null, null, true)}
  </div>`;
  html += `<div class="arrow-between">→</div>`;
  html += `<div class="grid-panel">
    <div class="grid-label">행 방향 min rowMin</div>
    <div class="grid-sub">m×nc = ${m}×${nc}  |  w=${w}</div>
    ${buildTable(s.rowMinSnap, m, nc, rmWin, null, s.rowMinCur, null, false)}
  </div>`;
  html += `<div class="arrow-between">→</div>`;
  html += `<div class="grid-panel">
    <div class="grid-label">결과 result</div>
    <div class="grid-sub">mr×nc = ${mr}×${nc}  |  h=${h}</div>
    ${buildTable(s.resultSnap, mr, nc, new Set(), null, s.resultCur, s.resultAns, false)}
  </div>`;
  document.getElementById('grids-row').innerHTML = html;

  // Operations log
  const opEl = document.getElementById('ops-list');
  if (!s.ops || s.ops.length === 0) {
    opEl.innerHTML = '<span class="ops-empty">연산 없음</span>';
  } else {
    let oh = '';
    s.ops.forEach((op, k) => {
      let typeLabel = '', typeCls = '';
      if      (op.type === 'front_pop') { typeLabel = '🗑 앞 제거'; typeCls = 'front-pop'; }
      else if (op.type === 'back_pop')  { typeLabel = '🗑 뒤 제거'; typeCls = 'back-pop';  }
      else if (op.type === 'push')      { typeLabel = '➕ 삽입';    typeCls = 'push';      }
      else if (op.type === 'record')    { typeLabel = '📝 기록';    typeCls = 'record';    }
      oh += `<div class="op-item">
        <span class="op-num">${k+1}.</span>
        <span class="op-type ${typeCls}">${typeLabel}</span>
        <span class="op-reason">${op.reason}</span>
      </div>`;
    });
    opEl.innerHTML = oh;
  }

  // Deque
  const di = document.getElementById('deque-items');
  if (!s.deque || s.deque.length === 0) {
    di.innerHTML = '<span class="deque-empty">비어있음 (empty)</span>';
  } else {
    let dh = '<span class="deque-label">front(min)→</span>';
    s.deque.forEach((item, i) => {
      if (i > 0) dh += '<span class="deque-sep"> | </span>';
      const cls = i === 0 ? 'deque-item is-front' : 'deque-item';
      dh += `<div class="${cls}">idx=${item.idx}&nbsp;(${D(item.val)})</div>`;
    });
    dh += `<span class="deque-label">←back</span>`;
    if (s.dequeAxis) dh += `<span class="deque-label"> ｜ ${s.dequeAxis}</span>`;
    di.innerHTML = dh;
  }

  // Min panel
  const mp = document.getElementById('min-panel');
  mp.innerHTML = s.minVal !== null
    ? `<div class="min-panel"><span class="min-label">기록된 min:</span><span class="min-value">${D(s.minVal)}</span></div>` : '';

  document.getElementById('progress-bar').style.width = `${(cur+1)/steps.length*100}%`;
  document.getElementById('step-counter').textContent = `${cur+1} / ${steps.length}`;
  document.getElementById('btn-prev').disabled = cur === 0;
  document.getElementById('btn-next').disabled = cur === steps.length - 1;
}

function navigate(d) { const n = cur + d; if (n >= 0 && n < steps.length) { cur = n; render(); } }

function loadExample(idx) {
  curEx = EXAMPLES[idx]; cur = 0;
  const g = generateSteps(curEx); steps = g.steps; nc = g.nc; mr = g.mr;
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === idx));
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
});

loadExample(0);
</script>
</body>
</html>
